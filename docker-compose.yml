version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evals_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./ai-eval/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/evals_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - EVALS_API_KEY=dev_default_key
    depends_on:
      - db

  frontend:
    build:
      context: ./ai-eval/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
